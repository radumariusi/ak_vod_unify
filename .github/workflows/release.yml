name: Release APK

# Rulează DOAR manual: Actions → Release APK → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versiune (ex. 0.1.0)"
        required: true
      prerelease:
        description: "Marchează ca pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ github.run_number }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
      WETRAKR_API_KEY: ${{ secrets.WETRAKR_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Două variante de semnare:
      #  A) recomandat (doar din telefon): signing/release.jks.enc din repo + secretul SIGNING_STORE_PASSWORD
      #  B) alternativ: SIGNING_KEYSTORE_BASE64 + SIGNING_STORE_PASSWORD + SIGNING_KEY_ALIAS + SIGNING_KEY_PASSWORD
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::Lipsește secretul SIGNING_STORE_PASSWORD (vezi README)."
            exit 1
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Folosesc keystore-ul din secretul SIGNING_KEYSTORE_BASE64."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"
          elif [ -f signing/release.jks.enc ]; then
            echo "Folosesc keystore-ul criptat din signing/release.jks.enc."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$KS" -pass env:SIGNING_STORE_PASSWORD \
              || { echo "::error::Nu pot decripta keystore-ul: parola SIGNING_STORE_PASSWORD e greșită?"; exit 1; }
          else
            echo "::error::Nu există keystore. Rulează întâi workflow-ul 'Generate signing key' (vezi README)."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_ALIAS" ] || echo "SIGNING_KEY_ALIAS=akvod" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_PASSWORD" ] || echo "SIGNING_KEY_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::APK-ul semnat nu a fost generat."; ls -la app/build/outputs/apk/release; exit 1
          fi
          OUT="ak-vod-unify-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          SCR=scrobbler/build/outputs/apk/release/scrobbler-release.apk
          if [ ! -f "$SCR" ]; then
            echo "::error::APK-ul AK Scrobbler nu a fost generat."; ls -la scrobbler/build/outputs/apk/release; exit 1
          fi
          SOUT="ak-scrobbler-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp "$SCR" "$SOUT"
          echo "scrobbler=$SOUT" >> "$GITHUB_OUTPUT"
          for R in ro us; do
            SRC_I=importer/build/outputs/apk/$R/release/importer-$R-release.apk
            if [ ! -f "$SRC_I" ]; then
              echo "::error::APK-ul AK Import $R nu a fost generat."; ls -laR importer/build/outputs/apk; exit 1
            fi
            OUT_I="ak-import-$R-${VERSION_NAME}-vc${VERSION_CODE}.apk"
            cp "$SRC_I" "$OUT_I"
            echo "import_$R=$OUT_I" >> "$GITHUB_OUTPUT"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: AK VOD Unify ${{ inputs.version_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.scrobbler }}
            ${{ steps.apk.outputs.import_ro }}
            ${{ steps.apk.outputs.import_us }}
