name: Release APK

on:
  push:
    branches: [codex/app-changes]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Build AK Scrobbler v0.3.26 for in-app update'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION_NAME: 0.3.26
      VERSION_CODE: ${{ github.run_number }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a176bc05b52845be8c4cb40b71a4134ec16d23f0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Două variante de semnare:
      #  A) recomandat (doar din telefon): signing/release.jks.enc din repo + secretul SIGNING_STORE_PASSWORD
      #  B) alternativ: SIGNING_KEYSTORE_BASE64 + SIGNING_STORE_PASSWORD + SIGNING_KEY_ALIAS + SIGNING_KEY_PASSWORD
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::Lipsește secretul SIGNING_STORE_PASSWORD (vezi README)."
            exit 1
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Folosesc keystore-ul din secretul SIGNING_KEYSTORE_BASE64."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"
          elif [ -f signing/release.jks.enc ]; then
            echo "Folosesc keystore-ul criptat din signing/release.jks.enc."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$KS" -pass env:SIGNING_STORE_PASSWORD \
              || { echo "::error::Nu pot decripta keystore-ul: parola SIGNING_STORE_PASSWORD e greșită?"; exit 1; }
          else
            echo "::error::Nu există keystore. Rulează întâi workflow-ul 'Generate signing key' (vezi README)."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_ALIAS" ] || echo "SIGNING_KEY_ALIAS=akvod" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_PASSWORD" ] || echo "SIGNING_KEY_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test, lint and build signed AK Scrobbler
        run: |
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :scrobbler:testDebugUnitTest :scrobbler:lintDebug :scrobbler:assembleRelease
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as E; suites = [E.parse(p).getroot() for p in Path("scrobbler/build/test-results/testDebugUnitTest").glob("TEST-*.xml")]; print("Scrobbler tests:", sum(int(s.attrib["tests"]) for s in suites))'

      - name: Preserve the existing Unify APK and verify signing
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(mktemp -d)
          gh release download v0.3.25 --pattern '*.apk' --dir "$previous"
          unify=ak-vod-unify-0.3.25-vc45.apk
          old_scrobbler=ak-scrobbler-0.3.25-vc45.apk
          scrobbler="ak-scrobbler-$VERSION_NAME-vc$VERSION_CODE.apk"
          cp "$previous/$unify" "$unify"
          cp scrobbler/build/outputs/apk/release/scrobbler-release.apk "$scrobbler"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -x "$apksigner"
          fingerprint() {
            "$apksigner" verify --print-certs "$1" | awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ { print $2; exit }'
          }
          old_signer=$(fingerprint "$previous/$old_scrobbler")
          new_signer=$(fingerprint "$scrobbler")
          test -n "$new_signer"
          test "$old_signer" = "$new_signer"
          test "$(fingerprint "$unify")" = "$new_signer"
          stat -c '%n %s bytes' "$previous/$old_scrobbler" "$scrobbler"
          echo "unify=$unify" >> "$GITHUB_OUTPUT"
          echo "scrobbler=$scrobbler" >> "$GITHUB_OUTPUT"

      - name: Confirm release source checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/app-changes" --jq '.object.sha')
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq '.tree.sha')
          test "$tree" = "19f4aa400316ffab54fc4a9880e71df7b71a132e"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.26
          name: AK Scrobbler 0.3.26 și AK VOD Unify 0.3.25
          target_commitish: codex/app-changes
          make_latest: true
          body: |
            AK Scrobbler se deschide într-o fereastră compactă, cu setări, jurnal și reconectare manuală.
            APK-ul AK VOD Unify este același din v0.3.25, păstrat aici pentru instalările mai vechi.
          files: |
            ${{ steps.apk.outputs.unify }}
            ${{ steps.apk.outputs.scrobbler }}
          fail_on_unmatched_files: true

      - name: Preserve signed APK if publishing fails
        if: failure() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ak-scrobbler-0.3.26
          path: ${{ steps.apk.outputs.scrobbler }}
          retention-days: 14
