name: Release APK

# Declanșare punctuală pentru pachetul Unify 0.3.26.
on:
  push:
    branches: [codex/app-changes]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versiune (ex. 0.1.0)"
        required: true
      prerelease:
        description: "Marchează ca pre-release"
        type: boolean
        default: false
      apk_only:
        description: "Salvează APK-urile semnate ca artefact pentru testare"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Build synchronized Unify 0.3.26 update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: 0.3.26
      VERSION_CODE: 47
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
      WETRAKR_API_KEY: ${{ secrets.WETRAKR_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '8171972bfab77b14fcdda41b9c5bb06cb0655758'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Două variante de semnare:
      #  A) recomandat (doar din telefon): signing/release.jks.enc din repo + secretul SIGNING_STORE_PASSWORD
      #  B) alternativ: SIGNING_KEYSTORE_BASE64 + SIGNING_STORE_PASSWORD + SIGNING_KEY_ALIAS + SIGNING_KEY_PASSWORD
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::Lipsește secretul SIGNING_STORE_PASSWORD (vezi README)."
            exit 1
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Folosesc keystore-ul din secretul SIGNING_KEYSTORE_BASE64."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"
          elif [ -f signing/release.jks.enc ]; then
            echo "Folosesc keystore-ul criptat din signing/release.jks.enc."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$KS" -pass env:SIGNING_STORE_PASSWORD \
              || { echo "::error::Nu pot decripta keystore-ul: parola SIGNING_STORE_PASSWORD e greșită?"; exit 1; }
          else
            echo "::error::Nu există keystore. Rulează întâi workflow-ul 'Generate signing key' (vezi README)."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_ALIAS" ] || echo "SIGNING_KEY_ALIAS=akvod" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_PASSWORD" ] || echo "SIGNING_KEY_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Refresh Home popularity data
        run: |
          if ! timeout 90s python3 tools/refresh-home-popularity.py; then
            echo "::warning::Netflix charts could not be refreshed; using the bundled index."
          fi

      - name: Verify and build signed AK VOD Unify
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Stage signed APKs
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(mktemp -d)
          gh release download v0.3.26 --pattern '*.apk' --dir "$previous"
          unify=ak-vod-unify-0.3.26-vc47.apk
          scrobbler=ak-scrobbler-0.3.26-vc47.apk
          cp app/build/outputs/apk/release/app-release.apk "$unify"
          cp "$previous/$scrobbler" "$scrobbler"
          echo "unify=$unify" >> "$GITHUB_OUTPUT"
          echo "scrobbler=$scrobbler" >> "$GITHUB_OUTPUT"
          echo "previous=$previous/ak-vod-unify-0.3.25-vc45.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK versions and signing certificates
        env:
          PREVIOUS_UNIFY: ${{ steps.apk.outputs.previous }}
          NEXT_UNIFY: ${{ steps.apk.outputs.unify }}
          SCROBBLER_APK: ${{ steps.apk.outputs.scrobbler }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$sdk/build-tools/35.0.0"
          if [ ! -x "$build_tools/apksigner" ]; then
            signer_path=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)
            build_tools=$(dirname "$signer_path")
          fi
          for apk in "$PREVIOUS_UNIFY" "$NEXT_UNIFY" "$SCROBBLER_APK"; do
            "$build_tools/apksigner" verify --print-certs "$apk" > "$apk.sig"
          done
          signer() {
            sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64}).*/\1/p' "$1.sig" | sort -u
          }
          unify=$(signer "$NEXT_UNIFY")
          test -n "$unify"
          test "$unify" = "$(signer "$PREVIOUS_UNIFY")"
          test "$unify" = "$(signer "$SCROBBLER_APK")"
          unify_info=$("$build_tools/aapt" dump badging "$NEXT_UNIFY")
          scrobbler_info=$("$build_tools/aapt" dump badging "$SCROBBLER_APK")
          grep -F "package: name='ro.ak.vodunify' versionCode='47' versionName='0.3.26'" <<< "$unify_info"
          grep -F "package: name='ro.ak.vodscrobbler' versionCode='47' versionName='0.3.26'" <<< "$scrobbler_info"

      - name: Confirm release branch matches the built source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/app-changes" --jq '.object.sha')
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq '.tree.sha')
          test "$tree" = "3eb20f469a48f2511fc46d961fdef9eba2a439ad"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.26-unify
          name: AK VOD Unify și AK Scrobbler 0.3.26
          target_commitish: codex/app-changes
          make_latest: true
          body: |
            Unify și Scrobbler afișează aceeași versiune, 0.3.26 (vc47).
            Unify grupează cinema RO/SUA în aceeași zi, îmbunătățește Luna și actualizează Noutățile și sigla de redare.
          files: |
            ${{ steps.apk.outputs.unify }}
            ${{ steps.apk.outputs.scrobbler }}
          fail_on_unmatched_files: true

      - name: Preserve signed APKs if publishing fails
        if: failure() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ak-vod-unify-0.3.26-vc47
          path: '*.apk'
          retention-days: 14
