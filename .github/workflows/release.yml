name: Release APK

on:
  push:
    branches: [codex/app-changes]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Build AK Scrobbler v0.3.26 for in-app update'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION_NAME: 0.3.26
      VERSION_CODE: ${{ github.run_number }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a176bc05b52845be8c4cb40b71a4134ec16d23f0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Două variante de semnare:
      #  A) recomandat (doar din telefon): signing/release.jks.enc din repo + secretul SIGNING_STORE_PASSWORD
      #  B) alternativ: SIGNING_KEYSTORE_BASE64 + SIGNING_STORE_PASSWORD + SIGNING_KEY_ALIAS + SIGNING_KEY_PASSWORD
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::Lipsește secretul SIGNING_STORE_PASSWORD (vezi README)."
            exit 1
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Folosesc keystore-ul din secretul SIGNING_KEYSTORE_BASE64."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"
          elif [ -f signing/release.jks.enc ]; then
            echo "Folosesc keystore-ul criptat din signing/release.jks.enc."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$KS" -pass env:SIGNING_STORE_PASSWORD \
              || { echo "::error::Nu pot decripta keystore-ul: parola SIGNING_STORE_PASSWORD e greșită?"; exit 1; }
          else
            echo "::error::Nu există keystore. Rulează întâi workflow-ul 'Generate signing key' (vezi README)."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_ALIAS" ] || echo "SIGNING_KEY_ALIAS=akvod" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_PASSWORD" ] || echo "SIGNING_KEY_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed AK Scrobbler
        run: |
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :scrobbler:assembleRelease

      - name: Prepare Scrobbler APK and preserve the existing Unify APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(mktemp -d)
          gh release download v0.3.25 --pattern '*.apk' --dir "$previous"
          unify=ak-vod-unify-0.3.25-vc45.apk
          old_scrobbler=ak-scrobbler-0.3.25-vc45.apk
          scrobbler="ak-scrobbler-$VERSION_NAME-vc$VERSION_CODE.apk"
          cp "$previous/$unify" "$unify"
          cp scrobbler/build/outputs/apk/release/scrobbler-release.apk "$scrobbler"
          stat -c '%n %s bytes' "$previous/$old_scrobbler" "$scrobbler"
          echo "unify=$unify" >> "$GITHUB_OUTPUT"
          echo "scrobbler=$scrobbler" >> "$GITHUB_OUTPUT"
          echo "previous=$previous/$old_scrobbler" >> "$GITHUB_OUTPUT"

      - name: Verify signing and APK version
        env:
          PREVIOUS_SCROBBLER: ${{ steps.apk.outputs.previous }}
          NEXT_SCROBBLER: ${{ steps.apk.outputs.scrobbler }}
          UNIFY_APK: ${{ steps.apk.outputs.unify }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$sdk/build-tools/35.0.0"
          if [ ! -x "$build_tools/apksigner" ]; then
            signer_path=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)
            build_tools=$(dirname "$signer_path")
          fi
          test -x "$build_tools/apksigner"
          "$build_tools/apksigner" version
          for apk in "$PREVIOUS_SCROBBLER" "$NEXT_SCROBBLER" "$UNIFY_APK"; do
            echo "Verifying $apk"
            "$build_tools/apksigner" verify --print-certs "$apk" | tee "$apk.sig"
          done
          signer() {
            sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64}).*/\1/p' "$1.sig" | sort -u
          }
          old=$(signer "$PREVIOUS_SCROBBLER")
          new=$(signer "$NEXT_SCROBBLER")
          unify=$(signer "$UNIFY_APK")
          if [ -z "$new" ] || [ "$old" != "$new" ] || [ "$unify" != "$new" ]; then
            echo "::error::APK signing certificate differs or could not be read."
            exit 1
          fi
          badging=$("$build_tools/aapt" dump badging "$NEXT_SCROBBLER")
          grep -F "package: name='ro.ak.vodscrobbler' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$badging"

      - name: Confirm release source checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/app-changes" --jq '.object.sha')
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq '.tree.sha')
          test "$tree" = "19f4aa400316ffab54fc4a9880e71df7b71a132e"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.26
          name: AK Scrobbler 0.3.26 și AK VOD Unify 0.3.25
          target_commitish: codex/app-changes
          make_latest: true
          body: |
            AK Scrobbler se deschide într-o fereastră compactă, cu setări, jurnal și reconectare manuală.
            APK-ul AK VOD Unify este același din v0.3.25, păstrat aici pentru instalările mai vechi.
          files: |
            ${{ steps.apk.outputs.unify }}
            ${{ steps.apk.outputs.scrobbler }}
          fail_on_unmatched_files: true

      - name: Preserve signed APK if publishing fails
        if: failure() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ak-scrobbler-0.3.26
          path: ${{ steps.apk.outputs.scrobbler }}
          retention-days: 14
