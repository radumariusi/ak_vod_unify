name: Release APK

# Release-ul 0.3.25 pornește și de la commitul de publicare de pe codex/app-changes.
on:
  push:
    branches: [codex/app-changes]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versiune (ex. 0.1.0)"
        required: true
      prerelease:
        description: "Marchează ca pre-release"
        type: boolean
        default: false
      apk_only:
        description: "Salvează APK-urile semnate ca artefact pentru testare"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Build signed APKs for v0.3.25'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version_name || '0.3.25' }}
      VERSION_CODE: ${{ github.run_number }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
      WETRAKR_API_KEY: ${{ secrets.WETRAKR_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && '1b031fd358ca61c4e24376891a2fb4348393b850' || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Două variante de semnare:
      #  A) recomandat (doar din telefon): signing/release.jks.enc din repo + secretul SIGNING_STORE_PASSWORD
      #  B) alternativ: SIGNING_KEYSTORE_BASE64 + SIGNING_STORE_PASSWORD + SIGNING_KEY_ALIAS + SIGNING_KEY_PASSWORD
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::Lipsește secretul SIGNING_STORE_PASSWORD (vezi README)."
            exit 1
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Folosesc keystore-ul din secretul SIGNING_KEYSTORE_BASE64."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"
          elif [ -f signing/release.jks.enc ]; then
            echo "Folosesc keystore-ul criptat din signing/release.jks.enc."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$KS" -pass env:SIGNING_STORE_PASSWORD \
              || { echo "::error::Nu pot decripta keystore-ul: parola SIGNING_STORE_PASSWORD e greșită?"; exit 1; }
          else
            echo "::error::Nu există keystore. Rulează întâi workflow-ul 'Generate signing key' (vezi README)."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_ALIAS" ] || echo "SIGNING_KEY_ALIAS=akvod" >> "$GITHUB_ENV"
          [ -n "$SIGNING_KEY_PASSWORD" ] || echo "SIGNING_KEY_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Refresh Home popularity data
        run: |
          if ! timeout 90s python3 tools/refresh-home-popularity.py; then
            echo "::warning::Netflix charts could not be refreshed; using the bundled index."
          fi

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::APK-ul semnat nu a fost generat."; ls -la app/build/outputs/apk/release; exit 1
          fi
          OUT="ak-vod-unify-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          SCR=scrobbler/build/outputs/apk/release/scrobbler-release.apk
          if [ ! -f "$SCR" ]; then
            echo "::error::APK-ul AK Scrobbler nu a fost generat."; ls -la scrobbler/build/outputs/apk/release; exit 1
          fi
          SOUT="ak-scrobbler-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp "$SCR" "$SOUT"
          echo "scrobbler=$SOUT" >> "$GITHUB_OUTPUT"

      - name: Confirm release source checkout
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/app-changes" --jq '.object.sha')
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq '.tree.sha')
          test "$tree" = "743dd362cb4027b0e36664b947041a71272e8f64"

      - name: Publish GitHub Release
        if: ${{ !inputs.apk_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AK VOD Unify ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.event_name == 'push' && 'codex/app-changes' || github.sha }}
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ !inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.scrobbler }}

      - name: Upload signed test APKs
        if: ${{ inputs.apk_only || (failure() && steps.apk.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: ak-vod-test-${{ env.VERSION_NAME }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.scrobbler }}
          if-no-files-found: error
          retention-days: 14
