name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
      WETRAKR_API_KEY: ${{ secrets.WETRAKR_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, unit tests
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Show lint errors
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          cat scrobbler/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ak-vod-unify-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload AK Scrobbler debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ak-scrobbler-debug
          path: scrobbler/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
